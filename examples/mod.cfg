#[include mod.cfg]

#####################################################################
#Плата расширения
#####################################################################
[mcu Mainboard_Ext]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E66178758B9E6422-if00
restart_method: command

[temperature_sensor Mainboard_Ext_RP2040]
sensor_type: temperature_mcu
sensor_mcu: Mainboard_Ext
min_temp: 0
max_temp: 100

[static_digital_output connects_led_mcu_expander]
pins: Mainboard_Ext:gpio0

[output_pin power_off]
pin: Mainboard_Ext:gpio13
shutdown_value: 1.0

[temperature_fan power_fan]
pin: Mainboard_Ext:gpio11
shutdown_speed: 1.0
kick_start_time: 0.5
off_below: 0.22
sensor_type: ATC Semitec 104GT-2
sensor_pin: Mainboard_Ext:gpio27
min_temp: -60
max_temp: 90
max_speed: 1.0
min_speed: 0.0
target_temp: 55
control: pid
pid_Kp: 25.0
pid_Ki: 1.0
pid_Kd: 0.5

[controller_fan Mainboard_fan_2]
pin: Mainboard_Ext:gpio14
max_power: 0.55
stepper:stepper_x,stepper_y

## TH1
# [temperature_sensor TH1]
# sensor_pin: Mainboard_Ext:gpio26

## TH3
# [temperature_sensor TH2]
# sensor_pin: Mainboard_Ext:gpio28

## MOSFET1
# [fan_generic mosfet1]
# pin: Mainboard_Ext:gpio15
# max_power: 1.0
# shutdown_speed: 1.0

## RESERVE
# RESERVE1 = Mainboard_Ext:gpio29

## UART
# RX = Mainboard_Ext:gpio9
# TX = Mainboard_Ext:gpio8

## SPI
# SDA = Mainboard_Ext:gpio4
# SCL = Mainboard_Ext:gpio5

## SERVO
# SERVO = Mainboard_Ext:gpio2

#####################################################################
#Led_Bed
#####################################################################
[neopixel Neopixel_Bed]
pin: Mainboard_Ext:gpio10
chain_count: 32
color_order: GRB


# -------------------------------------------------------------------
# Основной обработчик led_effect
# -------------------------------------------------------------------
#
# on_off_pin:
#   Общий выключатель подсветки через output_pin caselight.
#   Эффекты с ignore_on_off_pin: true игнорируют этот выключатель.
#
# door_button_pin:
#   Физический пин двери. Дверь читается напрямую внутри led_effect.py,
#   без [gcode_button], без DOOR_OPEN/DOOR_CLOSED и без макросов.
#
# door_button_open_state:
#   pressed  = нажатое состояние кнопки считается открытой дверью.
#   released = отпущенное состояние кнопки считается открытой дверью.
#   Для текущего Qidi: pressed = дверь открыта.
# -------------------------------------------------------------------
[led_effect]
on_off_pin: caselight
door_button_pin: Mainboard_Ext:gpio12
door_button_open_state: pressed


# -------------------------------------------------------------------
# Статус простоя / Idle_Status
# -------------------------------------------------------------------
[led_effect Idle_Status]
leds: neopixel:Neopixel_Bed
autostart: true
run_on_idle: true
frame_rate: 60
layers:        #полный цикл дыхания|удержание верхней яркости|цвет,максимальная яркость|гамма,минимальная яркость
    bambu_idle 5.6 3.0 top (0.720, 0.920, 0.720),(0.006, 0.85, 0.000)


# -------------------------------------------------------------------
# Обычная пауза / Pause_Status
# -------------------------------------------------------------------
# Когда включается:
#   run_on_pause: true
#
# Условие в плагине:
#   Активная печатная сессия + Klipper pause_resume.is_paused=True,
#   но датчики филамента НЕ сообщают проблему.
#
# Что показывает:
#   Спокойное оранжевое дыхание.
#
# Слой:
#   bambu_pause_breathe 2.5 0 top (цвет),(параметры)
#
# Параметры:
#   2.5 = полный цикл дыхания, сек.
#   0   = резервное поле слоя, сейчас не используется как яркость.
#
# Цвет 0:
#   (1.000, 0.180, 0.000)
#   Оранжевый оттенок паузы.
#
# Цвет 1 / параметры:
#   (0.015, 0.85, 0.000)
#   0.015 = максимальная яркость.
#   0.85  = локальная гамма.
#   0.000 = нижний уровень дыхания.
#
# ignore_on_off_pin:
#   Пауза должна отображаться даже если общий caselight выключен.
# -------------------------------------------------------------------
[led_effect Pause_Status]
leds: neopixel:Neopixel_Bed
run_on_pause: true
frame_rate: 60
ignore_on_off_pin: true
layers:
    bambu_pause_breathe 2.5 0 top (1.000, 0.180, 0.000),(0.015, 0.85, 0.000)


# -------------------------------------------------------------------
# Пауза из-за датчика / Pause_Attention_Status
# -------------------------------------------------------------------
# Когда включается:
#   run_on_pause_attention: true
#
# Условие в плагине:
#   Активная печатная сессия + пауза + один из датчиков филамента
#   сообщает filament_detected=False.
#
# Что показывает:
#   Оранжевая двойная вспышка. Это не полный Error_State, а состояние
#   "требуется вмешательство" во время печати.
#
# Слой:
#   bambu_pause_attention 1.0 0 top (цвет),(параметры)
#
# Параметры:
#   1.0 = полный цикл двойной вспышки, сек.
#   0   = резервное поле слоя.
#
# Цвет 0:
#   (1.000, 0.180, 0.000)
#   Оранжевый цвет предупреждения.
#
# Цвет 1 / параметры:
#   (0.015, 0.000, 1.00)
#   0.015 = яркость вспышки.
#   0.000 = фоновая яркость между вспышками.
#   1.00  = локальная гамма.
# -------------------------------------------------------------------
[led_effect Pause_Error_Status]
leds: neopixel:Neopixel_Bed
frame_rate: 60
ignore_on_off_pin: true
run_on_pause_attention: true
layers:
    bambu_pause_attention 1.0 0 top (1.000, 0.180, 0.000),(0.015, 0.000, 1.00)


# -------------------------------------------------------------------
# Подготовка к заданию / Preparing_for_Task
# -------------------------------------------------------------------
# Когда включается:
#   run_on_preparing: true
#
# Условие в плагине:
#   print_stats.state == printing, но реальная печать первого слоя ещё
#   не обнаружена. Плагин ждёт положительную экструзию E на низкой Z.
#
# Что показывает:
#   Оранжевый плавный поток, похожий на подготовку у Bambu.
#
# Слой:
#   bambu_flow 3.15 0.60 top (цвет волны),(фон),(параметры)
#
# Параметры:
#   3.15 = скорость движения потока.
#   0.60 = ширина волны.
#
# Цвет 0:
#   (1.000, 0.180, 0.000)
#   Цвет движущейся волны.
#
# Цвет 1:
#   (1.000, 0.180, 0.000)
#   Цвет фона.
#
# Цвет 2 / параметры:
#   (0.015, 0.002, 1.10)
#   0.015 = яркость волны.
#   0.002 = яркость фона.
#   1.10  = локальная гамма.
# -------------------------------------------------------------------
[led_effect Preparing_for_Task]
leds: neopixel:Neopixel_Bed
run_on_preparing: true
ignore_on_off_pin: true
frame_rate: 60
layers:
    bambu_flow 3.15 0.60 top (1.000, 0.180, 0.000),(1.000, 0.180, 0.000),(0.015, 0.002, 1.10)


# -------------------------------------------------------------------
# Задача выполняется / Task_in_Progress
# -------------------------------------------------------------------
# Когда включается:
#   run_on_progress: true
#
# Условие в плагине:
#   Печать реально началась: обнаружена положительная экструзия на
#   первом слое. До этого состояния работает Preparing_for_Task.
#
# Что показывает:
#   Полоса прогресса в стиле Bambu.
#
# Источник прогресса:
#   display_status.progress / M73, через self.printProgress.
#
# Слой:
#   bambu_bar 0.85 1.2 top (цвет заполнения),(цвет пустой части),(параметры)
#
# Параметры:
#   0.85 = скорость сглаживания прогресса.
#   1.2  = ширина мягкой границы в светодиодах.
#
# Цвет 0:
#   (0.720, 0.920, 0.720)
#   Цвет заполненной части.
#
# Цвет 1:
#   (0.000, 0.000, 0.000)
#   Цвет пустой части.
#
# Цвет 2 / параметры:
#   (0.018, 0.000, 0.85)
#   0.018 = яркость заполненной части.
#   0.000 = яркость пустой части.
#   0.85  = гамма мягкой границы.
# -------------------------------------------------------------------
[led_effect Task_in_Progress]
leds: neopixel:Neopixel_Bed
run_on_progress: true
ignore_on_off_pin: true
frame_rate: 60
layers:
    bambu_bar 0.85 1.2 top (0.720, 0.920, 0.720),(0.000, 0.000, 0.000),(0.018, 0.000, 0.85)


# -------------------------------------------------------------------
# Задача завершена / Task_Completed
# -------------------------------------------------------------------
# Когда включается:
#   run_on_completed: true
#
# Условие в плагине:
#   print_stats.state == complete и дверь ещё не открывали.
#
# Как сбрасывается:
#   Открытие двери переводит Completed обратно в Idle.
#   Дверь читается напрямую через door_button_pin в секции [led_effect].
#
# Что показывает:
#   Постоянный зелёный свет до действия пользователя.
#
# Слой:
#   bambu_complete 0 0 top (цвет),(параметры)
#
# Цвет 0:
#   (0.000, 1.000, 0.030)
#   Зелёный цвет завершения.
#
# Цвет 1 / параметры:
#   (0.015, 0.000, 0.000)
#   0.015 = яркость завершения.
#   остальные значения зарезервированы.
# -------------------------------------------------------------------
[led_effect Task_Completed]
leds: neopixel:Neopixel_Bed
run_on_completed: true
ignore_on_off_pin: true
frame_rate: 60
layers:
    bambu_complete 0 0 top (0.000, 1.000, 0.030),(0.015, 0.000, 0.000)


# -------------------------------------------------------------------
# Состояние ошибки / Error_State
# -------------------------------------------------------------------
# Когда включается:
#   run_on_error: true
#
# Важно:
#   Настоящий Klipper/MCU shutdown через NeoPixel надёжно не отображается,
#   потому что после shutdown Klipper может заблокировать вывод кадров.
#   Этот эффект оставлен как визуальный Error_State для живого Klipper
#   и ручного теста через SET_LED_EFFECT.
#
# Что показывает:
#   Красная двойная вспышка в стиле Bambu.
#
# Слой:
#   bambu_double_flash 1.0 0 top (цвет),(параметры)
#
# Параметры:
#   1.0 = полный цикл двойной вспышки, сек.
#   0   = резервное поле слоя.
#
# Цвет 0:
#   (1.000, 0.000, 0.000)
#   Красный цвет ошибки.
#
# Цвет 1 / параметры:
#   (0.030, 0.000, 0.000)
#   0.030 = яркость вспышки.
#   остальные значения зарезервированы.
# -------------------------------------------------------------------
[led_effect Error_State]
leds: neopixel:Neopixel_Bed
frame_rate: 60
ignore_on_off_pin: true
run_on_error: true
layers:
    bambu_double_flash 1.0 0 top (1.000, 0.000, 0.000),(0.030, 0.000, 0.000)
